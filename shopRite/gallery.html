<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shoprite – Gallery</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Top banner -->
    <div class="top">Demo website – Low prices. Every day.</div>

    <!-- Header and navigation -->
    <header>
      <div class="bar">
        <a class="logo" href="index.html">Shop<span>rite</span></a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="gallery.html" class="active">Gallery</a>
          <a href="about.html">About</a>
          <a href="inquiries.html">Inquiries</a>
          <button class="cartbtn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main>
      <h2>Gallery</h2>
      <div class="gallery">
        <div class="tile" style="background:#e2001a">🛒<small>In-store</small></div>
        <div class="tile" style="background:#2e9b4f">🥬<small>Fresh produce</small></div>
        <div class="tile" style="background:#d98a1c">🥖<small>Bakery</small></div>
        <div class="tile" style="background:#b3261e">🥩<small>Butchery</small></div>
        <div class="tile" style="background:#1f6fc2">🧃<small>Drinks</small></div>
        <div class="tile" style="background:#7b4bb7">🧼<small>Household</small></div>
        <div class="tile" style="background:#8a5a3c">🍫<small>Treats</small></div>
        <div class="tile" style="background:#222">🏷️<small>Specials</small></div>
      </div>
    </main>

    <!-- Footer -->
    <footer><b>Shoprite</b>2026 Shoprite Website Project </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
