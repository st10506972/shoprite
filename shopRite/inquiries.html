<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shoprite – Inquiries</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Top banner -->
    <div class="top">Demo website – Low prices. Every day.</div>

    <!-- Header and navigation -->
    <header>
      <div class="bar">
        <a class="logo" href="index.html">Shop<span>rite</span></a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="gallery.html">Gallery</a>
          <a href="about.html">About</a>
          <a href="inquiries.html" class="active">Inquiries</a>
          <button class="cartbtn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main>
      <h2>Inquiries</h2>
      <div class="two">
        <form id="inqForm" novalidate>
          <div>
            <label for="name">Full name</label>
            <input id="name" placeholder="Your name">
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">
          </div>
          <div>
            <label for="subject">Subject</label>
            <select id="subject">
              <option>Product inquiry</option>
              <option>Store information</option>
              <option>Feedback</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="How can we help?"></textarea>
          </div>
          <div class="err" id="error"></div>
          <button class="btn" type="submit">Send inquiry</button>
          <div class="ok">Thank you! We will get back to you soon.</div>
        </form>
        <div class="perk">
          <h3>Contact details</h3>
          <p>📞 0800 456 365<br>✉️ info@shoprite.com<br>🕗 Mon–Sun: 08:00 – 20:00</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer><b>Shoprite</b>2026 Shoprite Website Project </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
